name: cutouts
on:
  push:
    paths: ['tools/cutouts.txt','tools/cutout.py','.github/workflows/cutouts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install "rembg[cpu]" pillow
      - run: python tools/cutout.py
        env: {MODEL: birefnet-general-lite}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cutouts
          git commit -m "Add cut-out images" || echo nothing
          git push

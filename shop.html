<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shop | Raftaar concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="shop">
<div id="top"></div>
<main>
<section class="shop-head">
  <div class="wrap">
    <div class="row">
      <h1 class="mega" style="font-size:clamp(88px,15vw,220px)">Shop</h1>
      <p class="lead" style="max-width:26em"><b data-count>0</b> pieces. Heavyweight hoodies, oversized tees and hand-embroidered carry bags.</p>
    </div>
    <div class="row" style="align-items:center">
      <div class="chips" role="group" aria-label="Filter by piece">
        <button class="chip" data-c="all">Everything</button>
        <button class="chip" data-c="hoodies">Hoodies</button>
        <button class="chip" data-c="tees">Tees</button>
        <button class="chip" data-c="bags">Carry bags</button>
      </div>
      <label style="margin-top:28px"><span class="small">Sort </span><select class="sort"><option value="featured">Featured</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option></select></label>
    </div>
  </div>
</section>
<div class="wrap"><div class="grid-p"></div></div>
</main>
<div id="foot"></div>
<script src="assets/site.js"></script>
</body>
</html>

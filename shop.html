<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shop | Raftaar concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Noto+Sans+Gurmukhi:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="shop">
<div id="top"></div>
<main>
<section class="shop-head">
  <div class="row"><h1 class="thin">New drop</h1><p><b data-count>0</b> pieces. Heavyweight hoodies, oversized tees and hand-embroidered carry bags. Point at a piece to see the back.</p></div>
  <div class="row" style="align-items:center">
    <div class="chips" role="group" aria-label="Filter by piece">
      <button class="chip" data-c="all">Everything</button><button class="chip" data-c="hoodies">Hoodies</button><button class="chip" data-c="tees">Tees</button><button class="chip" data-c="bags">Carry bags</button>
    </div>
    <label style="margin-top:28px"><span class="small">Sort </span><select class="sort"><option value="featured">Featured</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option></select></label>
  </div>
</section>
<div class="grid-p"></div>
</main>
<div id="foot"></div>
<script src="assets/site.js"></script>
</body>
</html>
